<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my dear past love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" src="song.mp3" loop></audio>

<div class="sky">
  <span class="heart h1">❤</span>
  <span class="heart h2">❤</span>
  <span class="heart h3">❤</span>
  <span class="heart h4">❤</span>
  <span class="heart h5">❤</span>
  <span class="heart h6">❤</span>
</div>

<main class="card diary-card">
  <div class="heart-draw-wrap">
    <svg viewBox="0 0 100 88" class="heart-draw" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <linearGradient id="heartStrokeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd166"/>
          <stop offset="100%" stop-color="#ff6f91"/>
        </linearGradient>
        <clipPath id="heartClip">
          <path d="M50,88 C20,65 2,45 2,25 C2,10 15,0 28,0 C38,0 46,6 50,15 C54,6 62,0 72,0 C85,0 98,10 98,25 C98,45 80,65 50,88 Z"/>
        </clipPath>
      </defs>

      <image
        href="photo.jpg"
        xlink:href="photo.jpg"
        x="0" y="0" width="100" height="88"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#heartClip)"
        class="heart-photo"
      />

      <path
        class="heart-outline"
        d="M50,88 C20,65 2,45 2,25 C2,10 15,0 28,0 C38,0 46,6 50,15 C54,6 62,0 72,0 C85,0 98,10 98,25 C98,45 80,65 50,88 Z"
      />
    </svg>
  </div>

  <p class="diary-date" id="typedDate"></p>

  <h1 class="diary-greeting" id="typedGreeting"></h1>

  <p class="diary-text" id="typedDiary"></p>

  <div class="diary-btn-wrap" id="diaryBtnWrap">
    <button id="continueBtn" class="btn btn-yes">continue</button>
  </div>
</main>

<script src="music.js"></script>
<script src="petals.js"></script>
<script>
  const dateText = "2083.5.24 / 2026.sep.9";
  const greetingText = "My dear past love ♡";
  const diaryText =
    "Hey, it's been a year. Since then we became apart from each other. " +
    "Anyways!! I'm writing this diary for you so there will be no " +
    "misunderstanding and unusual things that happened between us. " +
    "Let me express myself, will you? ♡";

  const typedDate = document.getElementById("typedDate");
  const typedGreeting = document.getElementById("typedGreeting");
  const typedDiary = document.getElementById("typedDiary");
  const diaryBtnWrap = document.getElementById("diaryBtnWrap");

  function typeText(el, text, speed, onDone) {
    let i = 0;
    el.classList.add("typing-cursor");
    const timer = setInterval(() => {
      el.textContent += text[i];
      i++;
      if (i >= text.length) {
        clearInterval(timer);
        el.classList.remove("typing-cursor");
        if (onDone) onDone();
      }
    }, speed);
  }

  window.addEventListener("DOMContentLoaded", () => {
    typeText(typedDate, dateText, 45, () => {
      typeText(typedGreeting, greetingText, 60, () => {
        typeText(typedDiary, diaryText, 30, () => {
          diaryBtnWrap.classList.add("show");
        });
      });
    });
  });

  document.getElementById("continueBtn").addEventListener("click", () => {
    window.location.href = "page3.html";
  });
</script>
</body>
</html>
